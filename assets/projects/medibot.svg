<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="botBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="userBubble" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#botBg)"/>

  <!-- Window Header Bar -->
  <rect width="800" height="40" fill="rgba(15, 23, 42, 0.8)" rx="16"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <text x="400" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#a78bfa">Medical Assistant AI — Streamlit NLP Interface</text>

  <!-- Chat Container -->
  <rect x="50" y="60" width="700" height="360" rx="12" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(167, 139, 250, 0.2)"/>

  <!-- Message 1: Bot Welcome -->
  <g transform="translate(80, 85)">
    <!-- Bot Avatar -->
    <circle cx="20" cy="20" r="18" fill="#6366f1"/>
    <text x="20" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">🤖</text>
    <!-- Message Bubble -->
    <rect x="50" y="0" width="480" height="55" rx="12" fill="#1e293b"/>
    <text x="70" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#a78bfa">MediBot AI Assistant</text>
    <text x="70" y="42" font-family="'Inter', sans-serif" font-size="13" fill="#e2e8f0">Hello! I am your AI Medical Assistant. How can I help with your health query today?</text>
  </g>

  <!-- Message 2: User Input Query -->
  <g transform="translate(180, 160)">
    <!-- Message Bubble -->
    <rect x="0" y="0" width="460" height="50" rx="12" fill="url(#userBubble)"/>
    <text x="20" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#ffffff">What are the recommended preventive measures for cardiovascular health?</text>
    <!-- User Avatar -->
    <circle cx="485" cy="25" r="18" fill="#38bdf8"/>
    <text x="485" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">👤</text>
  </g>

  <!-- Message 3: Bot Structured Response -->
  <g transform="translate(80, 230)">
    <circle cx="20" cy="20" r="18" fill="#6366f1"/>
    <text x="20" y="25" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#ffffff">🤖</text>

    <rect x="50" y="0" width="560" height="110" rx="12" fill="#1e293b"/>
    <text x="70" y="24" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#a78bfa">MediBot AI (NLP Matched &amp; Verified)</text>
    <text x="70" y="48" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">Key preventive steps include:</text>
    <text x="85" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">• Maintaining a balanced low-sodium diet and regular aerobic exercise (150 mins/week)</text>
    <text x="85" y="90" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">• Routine monitoring of blood pressure, blood glucose, and lipid profiles.</text>
  </g>

  <!-- Text Input Bar at Bottom -->
  <rect x="70" y="365" width="660" height="40" rx="8" fill="#0f172a" stroke="rgba(167, 139, 250, 0.3)"/>
  <text x="90" y="390" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">Type your health query here (e.g., symptoms, medication guidance)...</text>
  <rect x="660" y="370" width="60" height="30" rx="6" fill="#6366f1"/>
  <text x="690" y="390" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Send</text>
</svg>
