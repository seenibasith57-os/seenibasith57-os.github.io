<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cardioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>
  </defs>

  <!-- Container Dark Window -->
  <rect width="800" height="450" rx="16" fill="url(#cardioBg)"/>
  
  <!-- Window Header Bar -->
  <rect width="800" height="40" fill="rgba(15, 23, 42, 0.8)" rx="16"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="20" r="6" fill="#10b981"/>
  <text x="400" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#94a3b8">CardioSense — Heart Health Risk Assessment Dashboard</text>

  <!-- Left Panel: Heart Score Gauge -->
  <rect x="30" y="60" width="350" height="360" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="205" y="95" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">Heart Health Score</text>
  
  <!-- Gauge Arc Visual -->
  <path d="M 85,270 A 120,120 0 0,1 325,270" fill="none" stroke="#334155" stroke-width="22" stroke-linecap="round"/>
  <path d="M 85,270 A 120,120 0 0,1 295,170" fill="none" stroke="url(#gaugeGrad)" stroke-width="22" stroke-linecap="round"/>

  <text x="205" y="240" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="54" font-weight="800" fill="#38bdf8">84.5</text>
  <text x="205" y="270" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#34d399">LOW RISK (OPTIMAL)</text>

  <rect x="60" y="320" width="290" height="70" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)"/>
  <text x="205" y="348" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">XGBoost Confidence: <tspan font-weight="bold" fill="#10b981">94.8%</tspan></text>
  <text x="205" y="370" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">PDF Report Ready for Download</text>

  <!-- Right Panel: Key Features & ML Metrics -->
  <rect x="410" y="60" width="360" height="360" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)"/>
  <text x="430" y="95" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Risk Factors Breakdown</text>

  <!-- Bar Graphs Visual -->
  <g transform="translate(430, 120)">
    <text x="0" y="15" font-family="sans-serif" font-size="12" fill="#cbd5e1">Cholesterol Level (210 mg/dL)</text>
    <rect x="0" y="25" width="320" height="10" rx="5" fill="#334155"/>
    <rect x="0" y="25" width="220" height="10" rx="5" fill="#38bdf8"/>

    <text x="0" y="65" font-family="sans-serif" font-size="12" fill="#cbd5e1">Systolic Blood Pressure (132 mmHg)</text>
    <rect x="0" y="75" width="320" height="10" rx="5" fill="#334155"/>
    <rect x="0" y="75" width="260" height="10" rx="5" fill="#818cf8"/>

    <text x="0" y="115" font-family="sans-serif" font-size="12" fill="#cbd5e1">Max Heart Rate (168 bpm)</text>
    <rect x="0" y="125" width="320" height="10" rx="5" fill="#334155"/>
    <rect x="0" y="125" width="280" height="10" rx="5" fill="#34d399"/>

    <text x="0" y="165" font-family="sans-serif" font-size="12" fill="#cbd5e1">ST Slope &amp; Exercise Angina</text>
    <rect x="0" y="175" width="320" height="10" rx="5" fill="#334155"/>
    <rect x="0" y="175" width="140" height="10" rx="5" fill="#c084fc"/>
  </g>

  <!-- Interactive Pulse Wave line at bottom -->
  <path d="M 430,370 L 490,370 L 510,330 L 530,400 L 550,310 L 570,380 L 590,370 L 730,370" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>
